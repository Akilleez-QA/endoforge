name: Bug report
description: Report a reproducible EndoForge defect.
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: 'For suspected vulnerabilities, follow [SECURITY.md](https://github.com/Akilleez-QA/endoforge/blob/main/SECURITY.md). Do not post sensitive details here. Use synthetic inputs and redact private data.'
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Explain what should happen and what happens instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include exact commands, steps, and synthetic inputs.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Commit and environment
      description: Include the commit SHA, operating system, Python and Node.js versions, and relevant tool or isolation setup.
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity (reporter's view)
      description: 'S1 wrong promotion, lost acknowledged records, isolation escape or credential/billing exposure; S2 unusable, no workaround; S3 degraded, workaround exists; S4 cosmetic or documentation. See docs/plan/software-management-plan.md section 9.'
      options:
        - S1
        - S2
        - S3
        - S4
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: Any workaround you found, or "none".
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Include relevant error output or redacted receipts and the checks you ran.
