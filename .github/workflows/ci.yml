name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        env:
          GITLEAKS_VERSION: "8.28.0"
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o gitleaks_checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz$" gitleaks_checksums.txt | sed 's/ .*/  gitleaks.tar.gz/' | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install ruff
        run: python -m pip install --disable-pip-version-check ruff==0.17.0
      - name: Lint
        run: make lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "26"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y age bubblewrap gcc
      - name: Install kernel test tools
        run: make tools
      - name: Repository tests
        run: make -k test
      - name: Optimized Python tests
        if: ${{ !cancelled() }}
        run: make -k test-optimized

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y age bubblewrap gcc
      - name: Install kernel test tools
        run: make tools
      - name: Install coverage.py
        run: python -m pip install --disable-pip-version-check coverage==7.10.7
      - name: Coverage
        shell: bash
        run: make coverage -k 2>&1 | tee coverage-output.txt
      - name: Extract coverage summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          {
            sed -n '/start of coverage report/,/end of coverage report/p' coverage-output.txt
            sed -n '/^Name .*Stmts .*Miss .*Cover/,$p' coverage-output.txt
          } > coverage-summary.txt
          test -s coverage-summary.txt
      - name: Upload coverage summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-summary
          path: coverage-summary.txt
          if-no-files-found: error

  rust-lane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.98.1
          rustup default 1.98.1
          ls "$(rustc +1.98.1 --print sysroot)/lib/rustlib/"
      - name: Install kernel test tools
        run: make tools
      - name: Rust lane tests
        run: make rust-lane-test
