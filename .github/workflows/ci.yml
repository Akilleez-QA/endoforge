name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "26"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y age bubblewrap gcc
      - name: Install kernel test tools
        run: |
          python -m pip install -r tools/kernel/requirements.txt
          curl -fsSL -o "$RUNNER_TEMP/wasm-tools.tar.gz" https://github.com/bytecodealliance/wasm-tools/releases/download/v1.262.0/wasm-tools-1.262.0-x86_64-linux.tar.gz
          echo "655b8df67d54c3ef9b52fc237c4e94bbfbb5f5f43825245cb0940a7002a9ed65  $RUNNER_TEMP/wasm-tools.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/wasm-tools.tar.gz" -C "$RUNNER_TEMP" --strip-components=1
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Repository tests
        run: make -k test
      - name: Optimized Python tests
        if: ${{ !cancelled() }}
        run: make -k test-optimized
