name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "26"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y age bubblewrap gcc
      - name: Install kernel test tools
        run: make tools
      - name: Repository tests
        run: make -k test
      - name: Optimized Python tests
        if: ${{ !cancelled() }}
        run: make -k test-optimized
